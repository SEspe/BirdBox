name: Build & Release (ESP-IDF)

# Every push: unit tests on the host, firmware build, UI JavaScript check.
# A v* tag additionally publishes the GitHub Release — CI owns releases: push
# the tag, do NOT create the release by hand (a hand-made release gets its
# asset and notes overwritten by this job anyway). See CLAUDE.md.

on:
  push:
    branches: ['**']   # every push builds (open-source posture, FSD §9)
    tags:
      - 'v*'           # e.g. v1.0.0 → builds ESP32-S3 + GitHub Release
  pull_request:

env:
  IDF_VERSION: v6.0.1   # pin ESP-IDF version

jobs:
  host-tests:
    name: Unit tests (host, gcc + ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run test/host
        run: make -C test/host test

  build-esp32s3:
    name: Build BirdBox (ESP32-S3, primary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: .
          command: idf.py build

      # The whole web UI is ONE inline <script> built from C string literals;
      # one JS syntax error kills every tab and the C compiler cannot see it.
      - name: Check the UI JavaScript parses
        run: |
          pip install --quiet esprima
          python3 tools/check-ui-js.py build/BirdBox.bin

      - name: Extract version & rename bin
        run: |
          VER=$(grep 'FIRMWARE_VERSION' main/version.h | grep -oP '"[^"]+"' | tr -d '"')
          cp build/BirdBox.bin BirdBox_esp32s3_v${VER}.bin
          echo "BIN=BirdBox_esp32s3_v${VER}.bin" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: BirdBox-esp32s3
          path: ${{ env.BIN }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [host-tests, build-esp32s3]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match FIRMWARE_VERSION
        run: |
          VER=$(grep 'FIRMWARE_VERSION' main/version.h | grep -oP '"[^"]+"' | tr -d '"')
          if [ "${GITHUB_REF_NAME}" != "v${VER}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match main/version.h (${VER})"
            exit 1
          fi

      # Notes come from the changelog entry for this version; the script fails
      # if there is none, so a tag cannot ship without its changelog entry.
      - name: Release notes from FSD_BirdBox_CHANGELOG.md
        run: python3 tools/release-notes.py "${GITHUB_REF_NAME}" > release-notes.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*.bin
          fail_on_unmatched_files: true
